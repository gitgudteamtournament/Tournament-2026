<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Team - Подання результатів</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #1a1a2e; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { margin-bottom: 15px; color: #16213e; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        textarea { min-height: 80px; }
        button { background: #0f3460; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { opacity: 0.9; }
        button.green { background: #27ae60; }
        .round-item { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .round-item .title { font-weight: bold; font-size: 16px; }
        .round-item .meta { color: #666; font-size: 13px; }
        .status-ACTIVE { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #27ae60; color: #fff; }
        label { font-weight: 600; display: block; margin-bottom: 3px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Team Panel — Подання результатів</h1>

    <div class="card">
        <h2>Активні раунди</h2>
        <button onclick="loadActive()">Оновити</button>
        <div id="activeRounds"></div>
    </div>

    <div class="card">
        <h2>Завантажити роботу</h2>
        <label>ID раунду</label>
        <input type="number" id="roundId" value="1">
        <label>ID команди</label>
        <input type="number" id="teamId" value="1">
        <label>Посилання на GitHub (обов'язково)</label>
        <input type="url" id="githubLink" placeholder="https://github.com/team/project">
        <label>Посилання на відео-демо (обов'язково)</label>
        <input type="url" id="videoLink" placeholder="https://youtube.com/... або Google Drive">
        <label>Live demo (опціонально)</label>
        <input type="url" id="liveDemoLink" placeholder="https://...">
        <label>Опис (опціонально)</label>
        <textarea id="description" placeholder="Що зроблено, як запускати"></textarea>
        <button class="green" onclick="submitWork()">Відправити</button>
    </div>

    <div class="card">
        <h2>Мої сабміти</h2>
        <label>ID команди</label>
        <div style="display:flex;gap:10px;">
            <input type="number" id="myTeamId" value="1" style="max-width:200px;">
            <button onclick="loadMySubs()">Завантажити</button>
        </div>
        <div id="mySubmissions"></div>
    </div>
</div>

<script>
    const BASE = 'http://localhost:8080';

    async function api(url, options = {}) {
        const resp = await fetch(BASE + url, {
            headers: { 'Content-Type': 'application/json', ...options.headers },
            ...options
        });
        if (!resp.ok) { const text = await resp.text(); throw new Error(text); }
        return resp;
    }

    async function loadActive() {
        try {
            const resp = await api('/api/rounds/active');
            const rounds = await resp.json();
            document.getElementById('activeRounds').innerHTML = rounds.map(r =>
                '<div class="round-item">' +
                '<div><span class="title">#' + r.id + ' ' + r.title + '</span> <span class="status-ACTIVE">ACTIVE</span></div>' +
                '<div class="meta">' + (r.description || '') + '</div>' +
                '<div class="meta"><strong>Дедлайн:</strong> ' + (r.endTime || '—') + '</div>' +
                '<div class="meta"><strong>Must have:</strong> ' + (r.requirements || '—') + '</div>' +
                '<div class="meta"><strong>Тех. вимоги:</strong> ' + (r.techRequirements || '—') + '</div>' +
                '</div>'
            ).join('');
        } catch (e) { alert(e.message); }
    }

    async function submitWork() {
        const body = {
            roundId: parseInt(document.getElementById('roundId').value),
            teamId: parseInt(document.getElementById('teamId').value),
            githubLink: document.getElementById('githubLink').value,
            videoLink: document.getElementById('videoLink').value,
            liveDemoLink: document.getElementById('liveDemoLink').value,
            description: document.getElementById('description').value
        };
        try {
            const resp = await api('/api/submissions', { method: 'POST', body: JSON.stringify(body) });
            alert('Сабміт створено! ID: ' + await resp.text());
            loadMySubs();
        } catch (e) { alert(e.message); }
    }

    async function loadMySubs() {
        const teamId = document.getElementById('myTeamId').value;
        try {
            const resp = await api('/api/submissions/team/' + teamId);
            const subs = await resp.json();
            document.getElementById('mySubmissions').innerHTML = subs.map(s =>
                '<div class="round-item">' +
                '<div><strong>#' + s.id + '</strong> — Раунд #' + s.roundId + ' (' + (s.status || '—') + ')</div>' +
                '<div class="meta">GitHub: <a href="' + s.githubLink + '" target="_blank">' + s.githubLink + '</a></div>' +
                '<div class="meta">Відео: <a href="' + s.videoLink + '" target="_blank">' + s.videoLink + '</a></div>' +
                (s.liveDemoLink ? '<div class="meta">Live: <a href="' + s.liveDemoLink + '" target="_blank">' + s.liveDemoLink + '</a></div>' : '') +
                '<div class="meta">Опис: ' + (s.description || '—') + '</div></div>'
            ).join('');
        } catch (e) { alert(e.message); }
    }

    loadActive();
</script>
</body>
</html>
