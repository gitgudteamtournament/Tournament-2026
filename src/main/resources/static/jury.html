<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Jury - Оцінювання</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #1a1a2e; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { margin-bottom: 15px; color: #16213e; }
        .submission-item { border: 1px solid #eee; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .submission-item h3 { margin-bottom: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        textarea { min-height: 60px; }
        button { background: #0f3460; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { opacity: 0.9; }
        button.green { background: #27ae60; }
        label { font-weight: 600; display: block; margin-bottom: 3px; font-size: 13px; }
        .score-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
        .score-row label { flex: 1; min-width: 120px; }
        .score-row input { width: 100%; }
        .meta { color: #666; font-size: 13px; }
        hr { margin: 15px 0; border: none; border-top: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <h1>Jury Panel — Оцінювання робіт</h1>

    <div class="card">
        <h2>Налаштування</h2>
        <label>Мій ID (журі)</label>
        <input type="number" id="juryId" value="2" style="max-width: 200px;">
        <button onclick="loadAssignments()">Завантажити призначені роботи</button>
    </div>

    <div id="assignments"></div>
</div>

<script>
    const BASE = 'http://localhost:8080';

    async function api(url, options = {}) {
        const resp = await fetch(BASE + url, {
            headers: { 'Content-Type': 'application/json', ...options.headers },
            ...options
        });
        if (!resp.ok) { const text = await resp.text(); throw new Error(text); }
        return resp;
    }

    async function loadAssignments() {
        const juryId = document.getElementById('juryId').value;
        const div = document.getElementById('assignments');
        try {
            const assignResp = await api('/api/evaluations/my-assignments/' + juryId);
            const ids = await assignResp.json();

            if (ids.length === 0) {
                div.innerHTML = '<div class="card"><p>Немає призначених робіт.</p></div>';
                return;
            }

            let html = '<div class="card"><h2>Призначені роботи</h2>';
            for (const sid of ids) {
                const subResp = await api('/api/submissions/' + sid);
                const sub = await subResp.json();

                let vals = { backend: 0, database: 0, frontend: 0, func: 0, usability: 0, musthave: 0, comment: '' };
                try {
                    const evResp = await api('/api/evaluations/submission/' + sid + '/jury/' + juryId);
                    const ev = await evResp.json();
                    if (ev && ev.id) {
                        vals = {
                            backend: ev.backendQuality || 0,
                            database: ev.databaseScore || 0,
                            frontend: ev.frontendQuality || 0,
                            func: ev.functionalityScore || 0,
                            usability: ev.usabilityScore || 0,
                            musthave: ev.mustHaveCompleteness || 0,
                            comment: ev.comment || ''
                        };
                    }
                } catch (e) {}

                html += '<div class="submission-item">' +
                    '<h3>Робота #' + sid + ' — Команда: ' + (sub.teamName || sub.teamId) + '</h3>' +
                    '<div class="meta">GitHub: <a href="' + sub.githubLink + '" target="_blank">' + sub.githubLink + '</a></div>' +
                    '<div class="meta">Відео: <a href="' + sub.videoLink + '" target="_blank">' + sub.videoLink + '</a></div>' +
                    (sub.liveDemoLink ? '<div class="meta">Live: <a href="' + sub.liveDemoLink + '" target="_blank">' + sub.liveDemoLink + '</a></div>' : '') +
                    (sub.description ? '<div class="meta">Опис: ' + sub.description + '</div>' : '') +
                    '<hr>' +
                    '<h4>Оцінювання</h4>' +
                    '<div class="score-row">' +
                    '<label>Backend (0-100): <input type="number" id="backend-' + sid + '" min="0" max="100" value="' + vals.backend + '"></label>' +
                    '<label>Database (0-100): <input type="number" id="database-' + sid + '" min="0" max="100" value="' + vals.database + '"></label>' +
                    '<label>Frontend (0-100): <input type="number" id="frontend-' + sid + '" min="0" max="100" value="' + vals.frontend + '"></label>' +
                    '</div>' +
                    '<div class="score-row">' +
                    '<label>Функціональність (0-100): <input type="number" id="func-' + sid + '" min="0" max="100" value="' + vals.func + '"></label>' +
                    '<label>Зручність (0-100): <input type="number" id="usability-' + sid + '" min="0" max="100" value="' + vals.usability + '"></label>' +
                    '<label>Must have (0-100): <input type="number" id="musthave-' + sid + '" min="0" max="100" value="' + vals.musthave + '"></label>' +
                    '</div>' +
                    '<label>Коментар:</label>' +
                    '<textarea id="comment-' + sid + '">' + vals.comment + '</textarea>' +
                    '<button class="green" onclick="saveEval(' + sid + ',' + juryId + ')">Зберегти оцінку</button>' +
                    '</div>';
            }
            html += '</div>';
            div.innerHTML = html;
        } catch (e) {
            div.innerHTML = '<div class="card"><p>Помилка: ' + e.message + '</p></div>';
        }
    }

    async function saveEval(submissionId, juryId) {
        const body = {
            submissionId: submissionId,
            juryId: parseInt(juryId),
            backendQuality: parseInt(document.getElementById('backend-' + submissionId).value) || 0,
            databaseScore: parseInt(document.getElementById('database-' + submissionId).value) || 0,
            frontendQuality: parseInt(document.getElementById('frontend-' + submissionId).value) || 0,
            functionalityScore: parseInt(document.getElementById('func-' + submissionId).value) || 0,
            usabilityScore: parseInt(document.getElementById('usability-' + submissionId).value) || 0,
            mustHaveCompleteness: parseInt(document.getElementById('musthave-' + submissionId).value) || 0,
            comment: document.getElementById('comment-' + submissionId).value
        };
        try {
            const resp = await api('/api/evaluations', { method: 'POST', body: JSON.stringify(body) });
            alert(await resp.text());
        } catch (e) { alert(e.message); }
    }
</script>
</body>
</html>
