<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Admin - Керування раундами</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #1a1a2e; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { margin-bottom: 15px; color: #16213e; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        textarea { min-height: 80px; resize: vertical; }
        button { background: #0f3460; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 5px; }
        button:hover { opacity: 0.9; }
        button.green { background: #27ae60; }
        button.red { background: #e74c3c; }
        button.orange { background: #f39c12; }
        button.small { padding: 5px 10px; font-size: 12px; }
        .round-item { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .round-item .title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .round-item .meta { color: #666; font-size: 13px; margin-bottom: 5px; }
        .round-item .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-DRAFT { background: #ddd; }
        .status-ACTIVE { background: #27ae60; color: #fff; }
        .status-SUBMISSION_CLOSED { background: #f39c12; color: #fff; }
        .status-EVALUATED { background: #3498db; color: #fff; }
        .submission-item { border: 1px solid #eee; padding: 12px; margin-bottom: 8px; border-radius: 6px; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .mb-10 { margin-bottom: 10px; }
        label { font-weight: 600; display: block; margin-bottom: 3px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Admin Panel — Керування раундами</h1>

    <div class="grid">
        <div class="card">
            <h2>Створити раунд</h2>
            <label>ID турніру</label>
            <input type="number" id="tournamentId" value="1">
            <label>Назва</label>
            <input type="text" id="title" placeholder="Назва раунду">
            <label>Опис</label>
            <textarea id="description" placeholder="Опис завдання"></textarea>
            <label>Технічні вимоги</label>
            <textarea id="techRequirements" placeholder="Технічні вимоги"></textarea>
            <label>Критерії must have</label>
            <textarea id="requirements" placeholder="Must have критерії"></textarea>
            <label>Додаткові матеріали</label>
            <textarea id="materials" placeholder="Посилання, файли"></textarea>
            <label>Порядок</label>
            <input type="number" id="roundOrder" value="1">
            <label>Час старту</label>
            <input type="datetime-local" id="startTime">
            <label>Дедлайн</label>
            <input type="datetime-local" id="endTime">
            <button onclick="createRound()">Створити раунд</button>
        </div>

        <div class="card">
            <h2>Управління статусом</h2>
            <label>ID раунду</label>
            <input type="number" id="statusRoundId" value="1">
            <div class="flex mb-10">
                <button class="green" onclick="activateRound()">Active</button>
                <button class="orange" onclick="closeRound()">SubmissionClosed</button>
                <button onclick="evaluateRound()">Evaluated</button>
            </div>
            <hr style="margin: 15px 0;">
            <h2>Розподіл журі</h2>
            <label>ID раунду</label>
            <input type="number" id="distributeRoundId" value="1">
            <button class="orange" onclick="distribute()">Розподілити роботи</button>
        </div>
    </div>

    <div class="card">
        <h2>Список раундів</h2>
        <button onclick="loadRounds()">Оновити</button>
        <div id="roundList"></div>
    </div>

    <div class="card">
        <h2>Сабміти раунду</h2>
        <label>ID раунду</label>
        <div class="flex">
            <input type="number" id="submissionsRoundId" value="1" style="max-width: 200px;">
            <button onclick="loadSubmissions()">Завантажити</button>
        </div>
        <div id="submissionsList"></div>
    </div>

    <div class="card">
        <h2>Результати оцінювання</h2>
        <label>ID раунду</label>
        <div class="flex">
            <input type="number" id="resultsRoundId" value="1" style="max-width: 200px;">
            <button onclick="loadResults()">Показати</button>
        </div>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    const BASE = 'http://localhost:8080';

    async function api(url, options = {}) {
        const resp = await fetch(BASE + url, {
            headers: { 'Content-Type': 'application/json', ...options.headers },
            ...options
        });
        if (!resp.ok) {
            const text = await resp.text();
            throw new Error(text);
        }
        return resp;
    }

    async function createRound() {
        const body = {
            tournamentId: parseInt(document.getElementById('tournamentId').value),
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            techRequirements: document.getElementById('techRequirements').value,
            requirements: document.getElementById('requirements').value,
            materials: document.getElementById('materials').value,
            roundOrder: parseInt(document.getElementById('roundOrder').value) || 1,
            startTime: document.getElementById('startTime').value ? document.getElementById('startTime').value + ':00' : null,
            endTime: document.getElementById('endTime').value ? document.getElementById('endTime').value + ':00' : null
        };
        try {
            const resp = await api('/api/rounds', { method: 'POST', body: JSON.stringify(body) });
            alert(await resp.text());
            loadRounds();
        } catch (e) { alert(e.message); }
    }

    async function activateRound() {
        const id = document.getElementById('statusRoundId').value;
        try { const resp = await api('/api/rounds/' + id + '/activate', { method: 'PUT' }); alert(await resp.text()); loadRounds(); }
        catch (e) { alert(e.message); }
    }

    async function closeRound() {
        const id = document.getElementById('statusRoundId').value;
        try { const resp = await api('/api/rounds/' + id + '/close', { method: 'PUT' }); alert(await resp.text()); loadRounds(); }
        catch (e) { alert(e.message); }
    }

    async function evaluateRound() {
        const id = document.getElementById('statusRoundId').value;
        try { const resp = await api('/api/rounds/' + id + '/evaluated', { method: 'PUT' }); alert(await resp.text()); loadRounds(); }
        catch (e) { alert(e.message); }
    }

    async function distribute() {
        const roundId = document.getElementById('distributeRoundId').value;
        try {
            const resp = await api('/api/evaluations/distribute', {
                method: 'POST',
                body: JSON.stringify({ roundId: parseInt(roundId), evaluationsPerSubmission: 2, maxSubmissionsPerJuror: 5 })
            });
            alert(await resp.text());
        } catch (e) { alert(e.message); }
    }

    async function loadRounds() {
        try {
            const resp = await api('/api/rounds');
            const rounds = await resp.json();
            document.getElementById('roundList').innerHTML = rounds.map(r => `
                <div class="round-item">
                    <div class="flex">
                        <span class="title">#${r.id} ${r.title}</span>
                        <span class="status status-${r.status}">${r.status}</span>
                    </div>
                    <div class="meta">Турнір: ${r.tournamentId} | Дедлайн: ${r.endTime || '—'}</div>
                    <div class="meta">Must have: ${r.requirements || '—'}</div>
                    <div class="meta">Тех. вимоги: ${r.techRequirements || '—'}</div>
                </div>
            `).join('');
        } catch (e) { alert(e.message); }
    }

    async function loadSubmissions() {
        const roundId = document.getElementById('submissionsRoundId').value;
        try {
            const resp = await api('/api/submissions/round/' + roundId);
            const subs = await resp.json();
            document.getElementById('submissionsList').innerHTML = subs.map(s => `
                <div class="submission-item">
                    <div><strong>#${s.id}</strong> — Команда: ${s.teamName || s.teamId} (статус: ${s.status})</div>
                    <div>GitHub: <a href="${s.githubLink}" target="_blank">${s.githubLink}</a></div>
                    <div>Відео: <a href="${s.videoLink}" target="_blank">${s.videoLink}</a></div>
                    ${s.liveDemoLink ? '<div>Live: <a href="' + s.liveDemoLink + '" target="_blank">' + s.liveDemoLink + '</a></div>' : ''}
                    <div>Опис: ${s.description || '—'}</div>
                </div>
            `).join('');
        } catch (e) { alert(e.message); }
    }

    async function loadResults() {
        const roundId = document.getElementById('resultsRoundId').value;
        try {
            const scoresResp = await api('/api/evaluations/average/' + roundId);
            const scores = await scoresResp.json();
            const subResp = await api('/api/submissions/round/' + roundId);
            const subs = await subResp.json();
            document.getElementById('resultsList').innerHTML = subs.map(s => {
                const avg = scores[s.id];
                return '<div class="submission-item">' +
                    '<div><strong>' + (s.teamName || 'Команда #' + s.teamId) + '</strong></div>' +
                    '<div>Середній бал: ' + (avg != null ? avg : 'ще не оцінено') + '</div></div>';
            }).join('');
        } catch (e) { alert(e.message); }
    }

    loadRounds();
</script>
</body>
</html>
